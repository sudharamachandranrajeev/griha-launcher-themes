# Checks every theme on each push and pull request: format, engine features, files and sizes.
name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit (v4.2.2) so a moved tag can't change what runs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: pip install jsonschema==4.23.0
      - run: python3 tools/validate.py
