<!doctype html><html><head><meta charset="utf-8"><meta name="out" content="preview.png,360,780,3,png">
<link rel="stylesheet" href="style.css"><script src="../../../tools/art/common.js"></script>
<style>
html,body{width:360px;height:780px;overflow:hidden;background:url(../wallpapers/home.jpg) center/cover}
.wrap{padding:44px 18px 0}
.top{padding:22px 20px 16px}
.clock{font-size:54px;line-height:1;font-weight:900;letter-spacing:1px;text-shadow:2px 3px 0 rgba(0,0,0,.08)}
.week{display:flex;justify-content:space-between;margin-top:16px;height:40px;padding:0 6px;position:relative}
.week .bar{position:absolute;left:0;right:0;top:0;height:40px}
.day{position:relative;width:38px;text-align:center;font-weight:800;font-size:13px;padding-top:11px}
.day.on{background:#fff;border:2.6px solid #111;border-radius:10px;height:66px;margin-top:-6px;padding-top:14px}
.day span{display:block;margin-top:16px;font-weight:700}
.row{display:flex;gap:14px;margin-top:22px}
.tall{width:64px;height:200px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:13px}
.meter{flex:1;width:100%;margin-top:8px;border:2.6px solid #111;border-radius:22px;position:relative;overflow:hidden;background:#F6F5F2}
.meter i{position:absolute;left:0;right:0;bottom:0}
.meter b{position:absolute;top:44%;left:0;right:0;text-align:center;font-size:11.5px}
.app{width:75px;height:75px;display:flex;align-items:center;justify-content:center}
.app .ico{width:50px;height:50px;border-radius:16px;padding:11px;color:#fff}
.wide{height:96px;display:flex;align-items:center;padding:0 18px;gap:14px;margin-top:14px}
.wide .ico{width:44px;height:44px;flex:none}
.label{font-weight:900;font-size:17px;letter-spacing:.3px}
.sub{font-size:11px;color:var(--muted);letter-spacing:.3px}
</style></head><body><div class="wrap">
 <div class="card top">
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
   <div class="clock">08:41</div>
   <div style="display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;margin-top:6px">
    <span class="ico" data-icon="sun" data-stroke="#E8B800" data-width="2.4" style="width:34px;height:34px"></span>Clear 24°</div>
  </div>
  <div style="font-size:11px;margin-top:10px;color:#333">Pune, Maharashtra</div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px">
   <div style="font-weight:800;font-size:14px">Monday, 3 Nov</div>
   <div class="pill coral" style="height:38px;width:112px;font-size:15px">18° – 27°</div>
  </div>
  <div class="week"><div class="pill mint bar"></div>
   <div class="day on">Mon<span>3</span></div><div class="day">Tue<span>4</span></div><div class="day">Wed<span>5</span></div>
   <div class="day">Thu<span>6</span></div><div class="day on">Fri<span>7</span></div><div class="day">Sat<span>8</span></div><div class="day">Sun<span>9</span></div>
  </div><div style="height:28px"></div>
 </div>
 <div class="row">
  <div class="card tall">Power<div class="meter"><i class="mint" style="top:0"></i><b>100%</b>
    <span class="ico" data-icon="bolt" data-stroke="#111" data-width="1.6" style="position:absolute;left:13px;top:60%;width:20px;height:20px"></span></div></div>
  <div class="card tall">Music<div class="meter"><i class="coral" style="height:30%"></i><b>30%</b></div></div>
  <div style="display:flex;flex-direction:column;gap:14px">
   <div style="display:flex;gap:14px">
    <div class="card app"><span class="ico coral" data-icon="camera" data-stroke="#fff" style="background:var(--coral)"></span></div>
    <div class="card app"><span class="ico" data-icon="chat" data-stroke="#fff" style="background:var(--mint)"></span></div>
   </div>
   <div class="card wide" style="height:111px;margin:0;width:164px;padding:0 12px;gap:10px"><span class="ico" data-icon="camera" data-stroke="#86DB8A" data-width="2.2"></span>
    <div><div class="label" style="font-size:15px">CAMERA</div><div class="sub">Catch the moment</div></div></div>
  </div>
 </div>
 <div style="display:flex;gap:14px">
  <div class="card wide" style="flex:1"><span class="ico" data-icon="photos" data-stroke="#F48B8B" data-width="2.2"></span><div class="label">Album</div></div>
  <div class="card wide" style="flex:1"><span class="ico" data-icon="play" data-stroke="#86DB8A" data-width="2.2"></span><div class="label">Videos</div></div>
 </div>
 <div style="display:flex;gap:14px">
  <div class="card wide" style="flex:1"><span class="ico" data-icon="mail" data-stroke="#2AA1F2" data-width="2.2"></span><div class="label">Mail</div></div>
  <div class="card app" style="margin-top:14px;height:96px;width:96px;flex:none"><span class="ico" data-icon="music" data-stroke="#fff" style="background:#2AA1F2"></span></div>
 </div>
 <div style="text-align:center;font-weight:900;margin-top:16px;letter-spacing:.5px">PASTEL NEO</div>
</div></body></html>
