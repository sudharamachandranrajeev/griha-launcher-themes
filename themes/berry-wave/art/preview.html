<!doctype html><html><head><meta charset="utf-8"><meta name="out" content="preview.png,360,780,3,png">
<link rel="stylesheet" href="style.css"><script src="../../../tools/art/common.js"></script><style>
html,body{width:360px;height:780px;overflow:hidden;background:url(../wallpapers/home.jpg) center/cover}
.wrap{padding:46px 18px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pk{height:64px;border-radius:32px;display:flex;align-items:center;padding:0 16px 0 20px;background:linear-gradient(#fff,#FBF6F0);
 box-shadow:0 3px 0 #E2D6CB,0 10px 18px rgba(90,42,58,.16),inset 0 0 0 1px rgba(0,0,0,.04)}
.pk b{display:block;font-size:16px}.pk small{font-size:11px;color:var(--muted)}.pk .ico{width:22px;height:22px;margin-left:auto}
.glow{box-shadow:0 3px 0 #E2D6CB,0 0 0 1.5px rgba(217,36,110,.8),0 0 24px rgba(217,36,110,.55)}
</style></head><body><div class="wrap">
 <div class="grid">
  <div class="pk glow"><div><b>8:41 AM</b><small>Monday</small></div><span class="ico" style="color:#D9246E;font-size:18px;width:auto">◷</span></div>
  <div class="pk"><div><b>72%</b><small>Battery</small></div><span class="ico" style="width:auto">⚡</span></div>
  <div class="pk"><div><b>24°</b><small>clear sky</small></div><span class="ico" style="width:auto">☀</span></div>
  <div class="pk"><div><b>Apps</b><small>All of them</small></div><span class="ico" style="width:auto;font-size:20px">+</span></div></div>
 <div style="font-size:12px;letter-spacing:.16em;color:var(--muted);font-weight:700;margin:26px 0 12px">YOUR APPS</div>
 <div class="grid">
  <div class="pk glow"><div><b>Phone</b><small>Shortcut</small></div><span class="ico" data-icon="phone" data-stroke="#D9246E"></span></div>
  <div class="pk"><div><b>Messages</b><small>Shortcut</small></div><span class="ico" data-icon="chat"></span></div>
  <div class="pk"><div><b>Camera</b><small>Favourite</small></div><span class="ico" data-icon="camera"></span></div>
  <div class="pk"><div><b>Maps</b><small>Favourite</small></div><span class="ico" data-icon="map"></span></div>
  <div class="pk"><div><b>Music</b><small>Favourite</small></div><span class="ico" data-icon="music"></span></div>
  <div class="pk"><div><b>Photos</b><small>Favourite</small></div><span class="ico" data-icon="photos"></span></div>
  <div class="pk"><div><b>Browser</b><small>Favourite</small></div><span class="ico" data-icon="globe"></span></div>
  <div class="pk"><div><b>Mail</b><small>Favourite</small></div><span class="ico" data-icon="mail"></span></div></div>
</div></body></html>
