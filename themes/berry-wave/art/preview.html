<!doctype html><html><head><meta charset="utf-8"><meta name="out" content="preview.png,360,780,3,png">
<link rel="stylesheet" href="style.css"><style>
html,body{width:360px;height:780px;overflow:hidden;background:url(../wallpapers/home.jpg) center/cover}
.apps{position:absolute;left:34px;top:70px;display:flex;flex-direction:column;gap:26px;font-size:17px}
.apps div{display:flex;align-items:center;gap:20px}
.side{white-space:nowrap;position:absolute;writing-mode:vertical-rl;letter-spacing:.14em;font-weight:700}
</style></head><body>
<div class="apps">
 <div><i class="dot" style="background:#D9246E"></i>Photos</div><div><i class="dot" style="background:#F2A541"></i>Phone</div>
 <div><i class="dot" style="background:#3BA99C"></i>Messages</div><div><i class="dot" style="background:#4361EE"></i>Videos</div>
 <div><i class="dot" style="background:#7B2CBF"></i>Browser</div><div><i class="dot" style="background:#1B1420"></i>Music</div></div>
<div class="side" style="right:26px;top:70px;font-size:12px">08:41 AM</div>
<div style="position:absolute;right:33px;top:150px;width:2px;height:26px;background:#D9246E"></div>
<div style="position:absolute;right:20px;top:192px;text-align:right">
 <div style="font-size:38px;font-weight:800;letter-spacing:-1px">bloom<span style="color:#D9246E">.</span></div>
 <div style="font-size:9px;color:var(--muted)">slow mornings, warm cups</div>
 <div style="font-size:12px;color:#C21E5F;font-weight:600;margin-top:4px"><u style="text-underline-offset:3px">gentle</u> days.</div></div>
<div class="side" style="right:22px;top:300px;font-size:10px;color:#C21E5F">MONDAY, 3 NOV</div>
<div class="ring" style="width:132px;height:132px;left:150px;top:470px" id="clock">
 <div style="text-align:center"><div style="font-size:9px;color:#8a7d86;letter-spacing:.1em">- Clear -</div>
 <div style="font-size:28px;font-weight:300">( 08:41 )</div><div style="font-size:9px;color:#8a7d86;letter-spacing:.1em">- 03.11.2026 -</div></div></div>
<div class="ring" style="width:84px;height:84px;left:46px;top:610px"><svg width="84" height="84" style="position:absolute"><circle cx="42" cy="42" r="33" stroke="#F1E4E9" stroke-width="7" fill="none"/>
 <circle cx="42" cy="42" r="33" stroke="#1B1420" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="170 999" transform="rotate(-90 42 42)"/></svg><b style="font-weight:500;font-size:18px">82%</b></div>
<script>
let t='';for(let i=0;i<60;i++){const a=i/60*2*Math.PI,r=58;t+=`<circle cx="${66+r*Math.sin(a)}" cy="${66-r*Math.cos(a)}" r="${i%5?1.3:2}" fill="${i<41?'#D9246E':'#1B1420'}" opacity="${i<41?1:.5}"/>`}
document.getElementById('clock').insertAdjacentHTML('afterbegin',`<svg width="132" height="132" style="position:absolute;left:0;top:0">${t}</svg>`);
</script></body></html>
