<!doctype html><html><head><meta charset="utf-8"><meta name="out" content="preview.png,360,780,3,png">
<link rel="stylesheet" href="style.css"><script src="../../../tools/art/common.js"></script><style>
html,body{width:360px;height:780px;overflow:hidden;background:url(../wallpapers/home.jpg) center/cover}
.wrap{padding:40px 18px 0}.c{margin-top:14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.tile{height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:800}
.tile .blob{width:44px;height:44px;display:flex;align-items:center;justify-content:center}.tile .ico{width:22px;height:22px}
.nav{display:flex;justify-content:space-around;padding:10px 6px;margin-top:16px}.nav div{display:flex;flex-direction:column;align-items:center;font-size:10px;font-weight:800;color:var(--muted);gap:3px}
.nav .ico{width:20px;height:20px}.nav .on{color:var(--accent)}
</style></head><body><div class="wrap">
 <div class="card" style="padding:18px 20px">
  <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:42px;font-weight:900;line-height:1">08:41</div>
   <div class="key" style="width:54px;height:50px;display:flex;align-items:center;justify-content:center;background:var(--butter)"><span class="ico" data-icon="sun" data-stroke="#A87A00" data-width="2.4" style="width:26px;height:26px"></span></div></div>
  <div style="font-weight:800;font-size:15px;margin-top:8px">Monday, 3 Nov</div><div style="font-size:11px;color:var(--muted)">Clear 24° · Pune</div>
  <div class="field" style="height:14px;margin-top:12px;border-radius:999px;position:relative"><div class="primary" style="position:absolute;left:0;top:0;bottom:0;width:72%;border-radius:999px"></div></div>
  <div style="font-size:10px;color:var(--muted);margin-top:5px;font-weight:700">Battery is 72%</div></div>
 <div class="card c" style="padding:14px 18px;display:flex;align-items:center;gap:14px">
  <div class="primary" style="width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px">A</div>
  <div><div style="font-weight:900;font-size:16px">Good morning, Asha</div><div style="font-size:12px;color:var(--muted)">Thoughtful tools for a kinder day.</div></div></div>
 <div class="card c" style="padding:12px 18px"><div style="font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:800">BATTERY</div>
  <div style="display:flex;align-items:center;gap:10px;margin-top:8px"><div class="field" style="flex:1;height:14px;border-radius:999px;position:relative"><div class="primary" style="position:absolute;left:0;top:0;bottom:0;width:72%;border-radius:999px"></div></div><b>72%</b></div>
  <div style="font-size:11px;color:var(--muted);margin-top:4px">Making progress, one step at a time.</div></div>
 <div class="card c" style="padding:12px 16px;display:flex;align-items:center;gap:12px">
  <div class="field" style="width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:18px">🔔</div>
  <div><div style="font-weight:900;font-size:15px">You're all set!</div><div style="font-size:11px;color:var(--muted)">Battery is 72%</div></div></div>
 <div class="tiles">
  <div class="key tile"><div class="blob" style="background:var(--lav)"><span class="ico" data-icon="phone" data-stroke="#fff"></span></div>Phone</div>
  <div class="key tile"><div class="blob" style="background:var(--peach)"><span class="ico" data-icon="chat" data-stroke="#fff"></span></div>Messages</div>
  <div class="key tile"><div class="blob" style="background:#8FD3B6"><span class="ico" data-icon="camera" data-stroke="#fff"></span></div>Camera</div></div>
 <div class="card nav"><div class="on"><span class="ico" data-icon="leaf" data-stroke="#7A5CE0"></span>Home</div><div><span class="ico" data-icon="plus"></span>Apps</div>
  <div><span class="ico" data-icon="search"></span>Search</div><div><span class="ico" data-icon="gear"></span>Settings</div></div>
</div></body></html>
