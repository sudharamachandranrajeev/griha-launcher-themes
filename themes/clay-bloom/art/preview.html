<!doctype html><html><head><meta charset="utf-8"><meta name="out" content="preview.png,360,780,3,png">
<link rel="stylesheet" href="style.css"><script src="../../../tools/art/common.js"></script><style>
html,body{width:360px;height:780px;overflow:hidden;background:url(../wallpapers/home.jpg) center/cover}
.wrap{padding:50px 20px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.tile{height:98px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:700}
.tile .blob{width:46px;height:46px;display:flex;align-items:center;justify-content:center}.tile .ico{width:24px;height:24px}
</style></head><body><div class="wrap">
 <div class="card" style="padding:24px 26px">
  <div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="font-size:58px;font-weight:900;letter-spacing:-1px;line-height:1">08:41</div>
   <div class="blob" style="background:var(--butter);width:58px;height:54px;display:flex;align-items:center;justify-content:center"><span class="ico" data-icon="sun" data-stroke="#C98A00" data-width="2.4" style="width:30px;height:30px"></span></div></div>
  <div style="font-weight:800;font-size:16px;margin-top:10px">Monday, 3 November</div><div style="font-size:12px;color:var(--muted)">Clear, 24° · Pune</div>
  <div class="field" style="height:16px;margin-top:16px;border-radius:999px;position:relative"><div class="primary" style="position:absolute;left:0;top:0;bottom:0;width:72%;border-radius:999px"></div></div>
  <div style="font-size:11px;color:var(--muted);margin-top:6px;font-weight:600">Battery 72%</div>
 </div>
 <div class="tiles">
  <div class="key tile"><div class="blob" style="background:var(--lav)"><span class="ico" data-icon="phone" data-stroke="#fff"></span></div>Phone</div>
  <div class="key tile"><div class="blob" style="background:var(--peach)"><span class="ico" data-icon="chat" data-stroke="#fff"></span></div>Messages</div>
  <div class="key tile"><div class="blob" style="background:#8FD3B6"><span class="ico" data-icon="camera" data-stroke="#fff"></span></div>Camera</div>
  <div class="key tile"><div class="blob" style="background:#F7B6C8"><span class="ico" data-icon="photos" data-stroke="#fff"></span></div>Photos</div>
  <div class="key tile"><div class="blob" style="background:var(--butter)"><span class="ico" data-icon="music" data-stroke="#B07A00"></span></div>Music</div>
  <div class="key tile"><div class="blob" style="background:#9EC5F8"><span class="ico" data-icon="mail" data-stroke="#fff"></span></div>Mail</div>
 </div>
 <div class="card" style="margin-top:20px;padding:18px 22px;display:flex;align-items:center;gap:16px">
  <div class="primary" style="width:56px;height:56px;display:flex;align-items:center;justify-content:center;flex:none"><span class="ico" data-icon="leaf" data-stroke="#fff" style="width:26px;height:26px"></span></div>
  <div><div style="font-weight:900;font-size:18px">Focus · 25 min</div><div style="font-size:12px;color:var(--muted)">Three apps hidden until 9:10</div></div></div>
 <div class="field" style="height:54px;margin-top:20px;display:flex;align-items:center;gap:10px;padding:0 20px;font-weight:600"><span class="ico" data-icon="search" style="width:20px;height:20px"></span>Search apps or the web</div>
</div></body></html>
