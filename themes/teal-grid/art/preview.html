<!doctype html><html><head><meta charset="utf-8"><meta name="out" content="preview.png,360,780,3,png">
<link rel="stylesheet" href="style.css"><script src="../../../tools/art/common.js"></script><style>
html,body{width:360px;height:780px;overflow:hidden;background:url(../wallpapers/home.jpg) center/cover}
.wrap{padding:42px 20px 0;color:var(--ink)}
.chip{display:inline-block;padding:7px 14px;border-radius:16px;font-weight:700;font-size:13px;margin-right:6px}
.tabs{display:flex;margin-top:18px}.tabs div{flex:1;text-align:center;font-weight:700;font-size:14px;color:var(--muted);padding-bottom:8px;border-bottom:3px solid transparent}
.card{border-radius:12px;padding:14px 16px;margin-top:14px;background:linear-gradient(#136664,#0C4E4C);box-shadow:0 8px 18px rgba(3,31,30,.55),inset 0 1px 0 rgba(255,255,255,.14)}
.line{display:flex;justify-content:space-between;font-size:13px;margin-top:9px}.line span{color:var(--muted)}
.alert{display:flex;align-items:center;gap:10px;height:42px;border-radius:8px;padding:0 14px;margin-top:8px;font-size:13px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.tile{height:76px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10px;font-weight:700;background:linear-gradient(#15706D,#0D5250);box-shadow:0 4px 8px rgba(3,31,30,.6)}
.tile .ico{width:22px;height:22px}
</style></head><body><div class="wrap">
 <div style="font-size:58px;font-weight:700;line-height:1">8:41 AM</div>
 <div style="font-size:22px;font-weight:700;margin-top:4px">Monday, 3 November</div>
 <div style="font-size:13px;color:var(--muted)">Good morning, Asha</div>
 <div style="height:1px;background:rgba(243,237,226,.25);margin:12px 0"></div>
 <div><span class="chip" style="background:var(--gold);color:#1C2B2A">24° clear</span><span class="chip" style="border:1px solid rgba(243,237,226,.3)">Battery 72%</span><span class="chip" style="border:1px solid rgba(243,237,226,.3)">Pune</span></div>
 <div class="tabs"><div style="color:var(--gold);border-color:var(--gold)">Today</div><div>All apps</div><div>Settings</div></div>
 <div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>Today</b><span class="chip" style="background:var(--gold);color:#1C2B2A;font-size:10px;padding:3px 9px;margin:0">● Live</span></div>
  <div class="line"><span>Battery</span><b>72%</b></div><div class="line"><span>Outside</span><b>24°</b></div><div class="line"><span>Date</span><b>03.11.2026</b></div>
  <div style="display:flex;gap:10px;margin-top:12px"><div style="flex:1;height:38px;border-radius:10px;border:1px solid rgba(243,237,226,.3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">Settings</div>
  <div style="flex:1;height:38px;border-radius:10px;background:var(--gold);color:#1C2B2A;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">All apps</div></div></div>
 <div class="alert" style="background:rgba(46,158,91,.18);border:1px solid rgba(46,158,91,.6)"><span style="color:#5BD08C">✓</span>Battery is 72%</div>
 <div class="alert" style="background:rgba(47,111,224,.18);border:1px solid rgba(47,111,224,.6)"><span style="color:#7FA8F5">i</span>Outside: 24° clear sky</div>
 <div class="tiles">
  <div class="tile"><span class="ico" data-icon="phone" data-stroke="#E3B25B"></span>Phone</div><div class="tile"><span class="ico" data-icon="chat" data-stroke="#E3B25B"></span>Messages</div>
  <div class="tile"><span class="ico" data-icon="camera" data-stroke="#E3B25B"></span>Camera</div><div class="tile"><span class="ico" data-icon="map" data-stroke="#E3B25B"></span>Maps</div></div>
</div></body></html>
